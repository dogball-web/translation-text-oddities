<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>課程講義（第7–12週）</title><link rel="stylesheet" href="../assets/style.css"></head><body><div class="page-wrap"><div class="page-head"><h2>課程講義（第7–12週）.pdf</h2></div><div class="page-body"><a class="back" href="../course.html">← 返回課程頁</a><h3>Week 8｜Travel Notes</h3><p>指定文本為舊教材節選。請以敘述者的視角、空間關係與地點描述為翻譯重點。</p><h3>Week 9｜Translation comparison</h3><p>不同譯文可能同時合理，但必須標示推論成分。若原文只寫 <em>beyond</em>，不應自行補成「校園內」或「校園外」。</p><div class="annotation">課堂備註：地點不是語法標籤。不要用你熟悉的校園配置去補原文沒有說的東西。</div></div></div><script src="../assets/site.js"></script></body></html>
